# eita-reth-export — reads a reth datadir's current state (read-only) and writes it as the
# record stream `eita import-reth` turns into a version 2 snapshot (src/state/import.lisp).
# The reth crates are pinned to the revision Base's own node is built from (base/base
# Cargo.toml, `base/reth`), so the tables decode exactly as base-reth-node wrote them.
# Cargo.lock starts from that revision's lock file.
[package]
name = "eita-reth-export"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
reth-db = { git = "https://github.com/base/reth", rev = "2b20e42de9c42b51ea0fb56599fda3c2f22640ef" }
reth-db-api = { git = "https://github.com/base/reth", rev = "2b20e42de9c42b51ea0fb56599fda3c2f22640ef" }
reth-provider = { git = "https://github.com/base/reth", rev = "2b20e42de9c42b51ea0fb56599fda3c2f22640ef" }
reth-stages-types = { git = "https://github.com/base/reth", rev = "2b20e42de9c42b51ea0fb56599fda3c2f22640ef" }
reth-ethereum-primitives = { git = "https://github.com/base/reth", rev = "2b20e42de9c42b51ea0fb56599fda3c2f22640ef" }
reth-primitives-traits = "=0.8.2"
alloy-primitives = "=1.6.1"
eyre = "0.6"

[profile.release]
opt-level = 3
