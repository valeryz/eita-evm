# eita-engine-api — the Engine API edge of `eita engine` (src/engine/engine.lisp): HTTP, JWT
# and JSON-RPC framing for a consensus client, each call forwarded over a local socket.
# Versions pinned exactly, as in rust/pq.
[package]
name = "eita-engine-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.4"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
serde_json = "=1.0.145"
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"

[profile.release]
opt-level = 3
